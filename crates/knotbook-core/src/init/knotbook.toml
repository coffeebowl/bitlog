format = 1
name = "Knotbook"

[week]
first_day = "mon"
workdays = ["mon", "tue", "wed", "thu", "fri"]
target_hours = 40.0              # display only

[grid]
slot_minutes = 15
day_start = 07:00:00             # visible range
day_end = 19:00:00

[locations]
remote = "Remote"
office = "Office"
hybrid = "Hybrid"                # partly remote, partly in the office

[defaults]
location = "remote"
note_template = "templates/note.md"
