[package]
name = "knotbook-cli"
description = "Command line interface for Knotbook"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "knotbook"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
knotbook-core = { path = "../knotbook-core" }
