[package]
name = "bitlog-cli"
description = "Command line interface for BitLog"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bitlog"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
bitlog-core = { path = "../bitlog-core" }
bitlog-index = { path = "../bitlog-index" }
