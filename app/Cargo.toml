[package]
name = "knotbook-gtk"
description = "GNOME app for Knotbook"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["gnome_50"] }
knotbook-core = { path = "../crates/knotbook-core" }
